---

## Implementation binding

Components record satisfied contract versions in `memory/implemented.md`:

```yaml
LmsShell:
  implements:
    - lms-shell@1.0.0
  drift: none | detected
```

---

## Drift detection

```pseudo
function detectDrift(component):
  implemented = memory[component].implements
  for each contract in implemented:
    if contract.version < versions[contract.id].version:
      return DRIFT(component, contract)
```

See [../runtime/drift.md](../runtime/drift.md).

---

## Version bump rules

| Change type | Bump |
|-------------|------|
| Clarification, no behavior change | patch |
| New required behavior | minor |
| Breaking contract change | major + human approval |
