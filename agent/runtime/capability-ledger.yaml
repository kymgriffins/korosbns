## Update protocol (Build Evidence DoD)

After each Capability Validation:

1. Set `status` from evidence only.
2. Set `platform_changes` (must be `0` unless ADR + Rule of Three).
3. Set `constitution_exceptions` (must be `0`; if >0 record law + rationale — signal only).
4. Fill `evidence_complete` checklist (implementation, tests, review, retrospective, metrics, drift, ledger).
5. Attach evidence / retrospective / observability paths.
6. Update `drift_pct` from ARCHITECTURE-AUDIT (Knowledge layer).
7. Never mark `runtime_stage: validated` here — that is `state.yaml` + Gate 1.
8. Never schedule Platform Validation Review before CAP-010.

Agents: **prefer this ledger over inventing features.** Constitution frozen; knowledge living; product continuous.
