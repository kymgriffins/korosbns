# Capability Ledger
## Authoritative Capability Validation register — humans and agents

```yaml
# These are Capability Validations — not "features."
# Each entry either validates or falsifies the platform under Baseline freeze.
#
# status enum:
#   planned | in_progress | complete | validated | superseded
#
# "complete"  = capability gates PASS + review PASS (may predate platform validated)
# "validated" = complete AND included under runtime_stage: validated (post Gate 1)
# drift_pct   = estimated % specification ↔ implementation
# platform_changes       = constitutional edits attributable to this slice (Goal: 0)
# constitution_exceptions = times Builder could not ship without breaking a Law (Goal: 0)
#   If >0, record law_id + rationale. Do not silently rewrite the constitution.
#
# Change categories (PLATFORM.md):
#   Constitution (frozen) | Knowledge (living — this file) | Product (continuous)

version: 1
platform_version: "3.1"
baseline_frozen: "1.0"
platform_evolution: stopped
knowledge_layer: living
product_delivery: active
platform_validation_review:
  earliest_after: CAP-search  # LJP-010 — do not reopen constitution after CAP-004/005
  template: agent/reviews/PLATFORM-VALIDATION-REVIEW.md
kpi:
  platform_stability:
    definition: platform_constitutional_changes_per_capability
    goal: 0
  constitution_pressure:
    definition: constitution_exceptions_per_capability
    goal: 0
  phase_a_quality:
    platform_changes: 0
    interaction_patterns_added: 0
    design_tokens_added: 0
    reusable_component_ratio: ">=80%"
    screens_using_reference_components: "100%"
    reference_composition: docs/lms-spec/reference-composition-cap-004.md
  visual_critic_quality:
    threshold_score: 90
    visual_drift_threshold_pct: 5
    cqi_non_regression: true
updated: 2026-07-08
runtime_stage: draft
runtime_stage_note: >
  Capability status "complete" means slice evidence exists.
  Platform-wide runtime_stage: validated still waits Gate 1.
  CAP-004 promoted to Reference Composition (REF-COMP-004).
ui_completion:
