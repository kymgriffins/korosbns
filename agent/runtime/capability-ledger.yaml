      - rx001_pass
      - family_test_ft1_ft5_pass
      - editorial_rhythm_pass
      - civic_warmth_pass
      - pixel_discipline_pass
      - platform_changes_0
      - vc001_score_gte_90
      - visual_drift_lte_5
      - cqi_non_regression

